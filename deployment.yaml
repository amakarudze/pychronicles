# Blog
# --------------------
---
apiVersion: v1
kind: Service
metadata:
  name: blog-service
  labels: 
    app: blog
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 3000
      nodePort: 30001
      protocol: TCP
    selector:
      app: blog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-Deployment
  labels:
    app: blog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog
    template:
      metadata:
        labels:
          app: blog
      spec:
        initContainers:
          - name: