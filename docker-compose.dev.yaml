services:
  website:
    build: ./website
    env_file: ./website/.env
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      blog:
        condition: service_started
    volumes:
      - ./website:/website
    networks:
      - internal
    
  blog:
    build: ./blog
    env_file: ./blog/.env
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8001:8000"
    depends_on:
      blog_db:
        condition: service_healthy
    volumes:
      - ./blog:/blog
    networks:
      - internal

  blog_db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    env_file: .env
    environment:
      environment:
      POSTGRES_DB:      ${POSTGRES_DB}
      POSTGRES_USER:    ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - blog_data:/var/lib/postgresql
    networks:
      - internal

networks:
  internal:

volumes:
  blog_data:
